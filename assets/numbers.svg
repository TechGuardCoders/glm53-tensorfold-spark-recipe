<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img"
 aria-label="About 100 tokens per second on JSON and structured output; 0.44 seconds to first word on a returning agent session; 80 to 86 tokens per second for 4 people at once; 2.3 times faster than our previous vLLM build">
<defs>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F4F4"/><stop offset="1" stop-color="#8E8E8E"/></linearGradient>
 <linearGradient id="silverH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DADADA"/><stop offset="1" stop-color="#7A7A7A"/></linearGradient>
 <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55"><stop offset="0" stop-color="#1A1A1C"/><stop offset="1" stop-color="#000000"/></radialGradient>
</defs>
<rect width="1280" height="400" rx="18" fill="#000000"/>
<rect x="0.5" y="0.5" width="1279" height="399" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
<text x="64" y="58" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#D9D9D9">THE NUMBERS YOU FEEL</text>
<text x="1216" y="58" text-anchor="end" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8C8C8C">2x DGX Spark · base GLM-5.3-Flash EXL3 4-bit · stock OS</text>
<g transform="translate(64.0,92)">
 <rect width="270.0" height="260" rx="16" fill="#0D0D0F" stroke="#FFFFFF" stroke-opacity="0.14"/>
 <text x="24" y="92" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#silver)">~100<tspan font-size="26" font-weight="600" fill="#BDBDBD" dx="8">tok/s</tspan></text>
 <text x="24" y="146" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">JSON &amp; structured output</text>
 <text x="24" y="174" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8C8C8C">one user, streaming</text>
 <line x1="24" y1="200" x2="246.0" y2="200" stroke="#FFFFFF" stroke-opacity="0.12"/>
 <text x="24" y="232" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8C8C8C">77 tok/s on code · 50 on chat</text>
</g><g transform="translate(358.0,92)">
 <rect width="270.0" height="260" rx="16" fill="#0D0D0F" stroke="#FFFFFF" stroke-opacity="0.14"/>
 <text x="24" y="92" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#silver)">0.44<tspan font-size="26" font-weight="600" fill="#BDBDBD" dx="8">s</tspan></text>
 <text x="24" y="146" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">to first word</text>
 <text x="24" y="174" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8C8C8C">when an agent comes back</text>
 <line x1="24" y1="200" x2="246.0" y2="200" stroke="#FFFFFF" stroke-opacity="0.12"/>
 <text x="24" y="232" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8C8C8C">to a 39k-token session (24 s cold)</text>
</g><g transform="translate(652.0,92)">
 <rect width="270.0" height="260" rx="16" fill="#0D0D0F" stroke="#FFFFFF" stroke-opacity="0.14"/>
 <text x="24" y="92" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="url(#silver)">80–86<tspan font-size="26" font-weight="600" fill="#BDBDBD" dx="8">tok/s</tspan></text>
 <text x="24" y="146" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">4 people at once</text>
 <text x="24" y="174" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8C8C8C">combined throughput</text>
 <line x1="24" y1="200" x2="246.0" y2="200" stroke="#FFFFFF" stroke-opacity="0.12"/>
 <text x="24" y="232" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8C8C8C">~20–25 tok/s each, nobody waits</text>
</g><g transform="translate(946.0,92)">
 <rect width="270.0" height="260" rx="16" fill="#0D0D0F" stroke="#FFFFFF" stroke-opacity="0.14"/>
 <text x="24" y="92" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#silver)">2.3×<tspan font-size="26" font-weight="600" fill="#BDBDBD" dx="8"></tspan></text>
 <text x="24" y="146" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">faster than our old build</text>
 <text x="24" y="174" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8C8C8C">same Sparks, same weights</text>
 <line x1="24" y1="200" x2="246.0" y2="200" stroke="#FFFFFF" stroke-opacity="0.12"/>
 <text x="24" y="232" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8C8C8C">vLLM 21–23 → 49–53 tok/s chat</text>
</g>
</svg>
